<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffeaf1, #fff5f8);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 430px;
            padding: 30px 22px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,.15);
        }

        h1 {
            color: #ff4f81;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.5;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 25px;
            margin: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        #yes {
            background: #ff4f81;
            color: white;
            transition: .3s;
        }

        #no {
            background: #ddd;
            color: #333;
        }

        .hidden {
            display: none;
        }

        input, select {
            width: 92%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        label {
            display: block;
            text-align: left;
            width: 92%;
            margin: 12px auto 3px;
            font-weight: bold;
            color: #555;
        }

        #submit {
            background: #ff4f81;
            color: white;
            width: 92%;
            margin-top: 18px;
        }

        .choice {
            text-align: left;
            width: 92%;
            margin: auto;
        }

        .choice label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #eee;
            border-radius: 10px;
            cursor: pointer;
        }

        .choice input {
            width: auto;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="card">

    <!-- FIRST SCREEN -->

    <div id="question">

        <h1>💌 Hey...</h1>

        <p>
            I don't know you that well yet,
            but honestly, I'd really like to know you better.
        </p>

        <h2>Would you go on a date with me? 🥹</h2>

        <button id="yes" onclick="yesClicked()">
            YES ❤️
        </button>

        <button id="no" onclick="noClicked()">
            NO 😭
        </button>

    </div>


    <!-- DATE FORM -->

    <div id="datePage" class="hidden">

        <h1>😭❤️ YAY!</h1>

        <p>
            Okay, let's plan it together.
            <br>
            You choose what sounds fun! 😊
        </p>

        <form
            action="https://formspree.io/f/mbgralya"
            method="POST"
        >

            <label>Your name</label>

            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >


            <label>📅 What date are you free?</label>

            <input
                type="date"
                name="date"
                required
            >


            <label>🕐 What time?</label>

            <input
                type="time"
                name="time"
                required
            >


            <label>❤️ What kind of date?</label>

            <div class="choice">

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Movie"
                        required
                    >
                    🎬 Watch a movie
                </label>

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Eating together"
                    >
                    🍔 Eat together
                </label>

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Coffee / Cafe"
                    >
                    ☕ Coffee / Café
                </label>

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Walk / Hangout"
                    >
                    🚶 Walk / Hangout
                </label>

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Games"
                    >
                    🎮 Play games
                </label>

                <label>
                    <input
                        type="radio"
                        name="date_type"
                        value="Other"
                    >
                    ✨ Other
                </label>

            </div>


            <label>💭 Anything else?</label>

            <input
                type="text"
                name="message"
                placeholder="Tell me what you're thinking..."
            >


            <button id="submit" type="submit">
                SEND ❤️
            </button>

        </form>

    </div>

</div>


<script>

let yesSize = 18;

function noClicked() {

    yesSize += 8;

    const yesButton =
        document.getElementById("yes");

    yesButton.style.fontSize =
        yesSize + "px";

    yesButton.style.padding =
        (yesSize / 1.5) + "px " +
        (yesSize * 1.5) + "px";
}


function yesClicked() {

    document.getElementById("question")
        .classList.add("hidden");

    document.getElementById("datePage")
        .classList.remove("hidden");
}

</script>

</body>
</html>
